name: check-deals

on:
  schedule:
    - cron: "17 * * * *" # every hour (UTC); GitHub may start it a few minutes late
  workflow_dispatch: # "Run workflow" button for a manual run

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: check-deals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Torob answers are kept between runs so each run only asks about a few new products
      - uses: actions/cache@v4
        with:
          path: cache
          key: torob-${{ github.run_id }}
          restore-keys: torob-

      - run: node src/index.js --no-open --site site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
